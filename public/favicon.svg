  <!-- "TT" Monogram cut into the block -->
  <path d="M22 28 H30 M26 28 V42" stroke="#0369a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M34 28 H42 M38 28 V42" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Star Sparkle -->
  <path d="M48 12 L49.5 16 L53.5 17.5 L49.5 19 L48 23 L46.5 19 L42.5 17.5 L46.5 16 Z" fill="#fbbf24" />
